<!DOCTYPE html>
<html>
<head>
    <title>Face Recognition Attendance</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #eef4ff;
            text-align: center;
            padding: 40px;
        }

        .container {
            width: 700px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.15);
        }

        h1 {
            color: #1d4ed8;
        }

        video {
            width: 500px;
            max-width: 100%;
            border-radius: 12px;
            border: 3px solid #2563eb;
            margin-top: 20px;
            background: black;
        }

        canvas {
            display: none;
        }

        button {
            padding: 13px 25px;
            margin: 10px;
            border: none;
            border-radius: 7px;
            background: #2563eb;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        button:disabled {
            background: #999;
            cursor: not-allowed;
        }

        #status {
            margin-top: 20px;
            font-weight: bold;
            font-size: 18px;
        }

        #result {
            margin-top: 20px;
            padding: 15px;
            font-size: 18px;
            border-radius: 8px;
        }

        .success {
            color: green;
            background: #e8f8ec;
        }

        .failed {
            color: red;
            background: #ffecec;
        }

        .info {
            color: #1d4ed8;
            background: #eef4ff;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Face Recognition Attendance</h1>

    <p>
        Allow camera access and place your face in front of the camera.
    </p>

    <video id="camera" autoplay playsinline></video>

    <canvas id="canvas"></canvas>

    <br>

    <button id="startCameraButton" onclick="startCamera()">
        Start Camera
    </button>

    <button id="recognizeButton"
            onclick="startRecognition()"
            disabled>
        Recognize Face
    </button>

    <button onclick="viewReport()">
        View Attendance Report
    </button>

    <div id="status"></div>

    <div id="result"></div>

</div>

<script>

// ==========================================
// BACKEND API URL
// ==========================================

const API_URL = "https://automated-attendance-backend.onrender.com";

let cameraStream = null;


// ==========================================
// START CAMERA
// ==========================================

async function startCamera() {

    const status =
        document.getElementById("status");

    const result =
        document.getElementById("result");

    const video =
        document.getElementById("camera");

    const recognizeButton =
        document.getElementById("recognizeButton");

    try {

        status.innerText =
            "Requesting camera permission...";

        result.innerText = "";

        result.className = "info";


        cameraStream =
            await navigator.mediaDevices.getUserMedia({
                video: true,
                audio: false
            });


        video.srcObject =
            cameraStream;


        recognizeButton.disabled =
            false;


        status.innerText =
            "Camera started. Position your face in the camera.";

    }

    catch (error) {

        console.error(
            "Camera error:",
            error
        );

        status.innerText =
            "Camera could not be started.";

        result.innerText =
            "Please allow camera permission and try again.";

        result.className =
            "failed";
    }
}


// ==========================================
// CAPTURE IMAGE AND RECOGNIZE
// ==========================================

async function startRecognition() {

    const video =
        document.getElementById("camera");

    const canvas =
        document.getElementById("canvas");

    const status =
        document.getElementById("status");

    const result =
        document.getElementById("result");

    const button =
        document.getElementById("recognizeButton");


    if (!cameraStream) {

        status.innerText =
            "Please start the camera first.";

        return;
    }


    button.disabled = true;


    status.innerText =
        "Capturing face...";

    result.innerText = "";

    result.className =
        "info";


    try {

        // ----------------------------------
        // Capture current camera frame
        // ----------------------------------

        canvas.width =
            video.videoWidth;

        canvas.height =
            video.videoHeight;


        const context =
            canvas.getContext("2d");


        context.drawImage(
            video,
            0,
            0,
            canvas.width,
            canvas.height
        );


        // ----------------------------------
        // Convert frame to image
        // ----------------------------------

        const imageBlob =
            await new Promise(resolve => {

                canvas.toBlob(
                    resolve,
                    "image/jpeg",
                    0.9
                );

            });


        if (!imageBlob) {

            throw new Error(
                "Could not capture camera image."
            );
        }


        // ----------------------------------
        // Create multipart form data
        // ----------------------------------

        const formData =
            new FormData();


        formData.append(
            "image",
            imageBlob,
            "face.jpg"
        );


        status.innerText =
            "Checking face...";


        // ----------------------------------
        // Send image to Flask
        // ----------------------------------

        const response =
            await fetch(
                API_URL + "/recognize",
                {
                    method: "POST",
                    body: formData
                }
            );


        // ----------------------------------
        // Check server response
        // ----------------------------------

        if (!response.ok) {

            throw new Error(
                "Server returned HTTP " +
                response.status
            );
        }


        const data =
            await response.json();


        console.log(
            "Recognition response:",
            data
        );


        // ----------------------------------
        // ACTUAL RECOGNITION RESULT
        // ----------------------------------

        if (
            data.status === "success" &&
            data.recognized === true
        ) {

            status.innerText =
                "Face recognized successfully.";


            result.innerText =
                data.message;


            result.className =
                "success";

        }

        else {

            status.innerText =
                "Face not recognized.";


            result.innerText =
                data.message ||
                "No registered face recognized. Attendance was not marked.";


            result.className =
                "failed";
        }

    }

    catch (error) {

        console.error(
            "Recognition error:",
            error
        );


        status.innerText =
            "Recognition failed.";


        result.innerText =
            error.message;


        result.className =
            "failed";
    }

    finally {

        button.disabled =
            false;
    }
}


// ==========================================
// VIEW REPORT
// ==========================================

function viewReport() {

    window.location.href =
        "report.html";
}

</script>

</body>
</html>
