# Attendance Face Recognition Page

```html
<!DOCTYPE html>
<html>
<head>
    <title>Face Recognition Attendance</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #eef4ff;
            text-align: center;
            padding: 40px;
        }

        .container {
            width: 650px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.15);
        }

        h1 {
            color: #1d4ed8;
        }

        button {
            padding: 13px 25px;
            margin: 10px;
            border: none;
            border-radius: 7px;
            background: #2563eb;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        button:disabled {
            background: #999;
            cursor: not-allowed;
        }

        #status {
            margin-top: 20px;
            font-weight: bold;
            font-size: 18px;
        }

        #result {
            margin-top: 20px;
            padding: 15px;
            font-size: 18px;
            border-radius: 8px;
        }

        .success {
            color: green;
            background: #e8f8ec;
        }

        .failed {
            color: red;
            background: #ffecec;
        }

        .info {
            color: #1d4ed8;
            background: #eef4ff;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Face Recognition Attendance</h1>

    <p>
        Click the button below to start face recognition.
    </p>

    <button id="recognizeButton" onclick="startRecognition()">
        Start Face Recognition
    </button>

    <button onclick="viewReport()">
        View Attendance Report
    </button>

    <div id="status"></div>

    <div id="result"></div>

</div>

<script>

const API_URL =
    "https://automated-attendance-system-for-rural-0z5j.onrender.com";


// ------------------------------------
// START FACE RECOGNITION
// ------------------------------------

async function startRecognition() {

    const status =
        document.getElementById("status");

    const result =
        document.getElementById("result");

    const button =
        document.getElementById("recognizeButton");


    // Reset screen

    status.innerText =
        "Starting face recognition...";

    result.innerText = "";

    result.className = "info";

    button.disabled = true;


    try {

        const response =
            await fetch(
                API_URL + "/recognize",
                {
                    method: "POST"
                }
            );


        // ------------------------------------
        // CHECK HTTP RESPONSE
        // ------------------------------------

        if (!response.ok) {

            throw new Error(
                "Server returned HTTP " +
                response.status
            );

        }


        const data =
            await response.json();


        console.log(
            "Recognition response:",
            data
        );


        // ------------------------------------
        // CHECK ACTUAL RECOGNITION RESULT
        // ------------------------------------

        if (
            data.status === "success" &&
            data.recognized === true
        ) {

            status.innerText =
                "Face recognized successfully.";

            result.innerText =
                data.message ||
                "Attendance marked as Present.";

            result.className =
                "success";

        }


        else {

            status.innerText =
                "Face not recognized.";

            result.innerText =
                data.message ||
                "No registered face was recognized. Attendance was not marked.";

            result.className =
                "failed";

        }

    }


    catch (error) {

        console.error(
            "Recognition error:",
            error
        );


        status.innerText =
            "Recognition failed.";

        result.innerText =
            error.message;

        result.className =
            "failed";

    }


    finally {

        button.disabled = false;

    }

}


// ------------------------------------
// VIEW REPORT
// ------------------------------------

function viewReport() {

    window.location.href =
        "report.html";

}

</script>

</body>
</html>
```
