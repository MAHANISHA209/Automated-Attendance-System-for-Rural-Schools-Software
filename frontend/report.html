```html
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Attendance Report</title>


    <style>

        body {

            font-family: Arial, sans-serif;

            background: #eef4ff;

            padding: 40px;

            text-align: center;
        }


        .container {

            width: 900px;

            max-width: 95%;

            margin: auto;

            background: white;

            padding: 30px;

            border-radius: 15px;

            box-shadow:
                0 5px 20px rgba(0, 0, 0, 0.15);
        }


        h1 {

            color: #1d4ed8;

            margin-bottom: 10px;
        }


        table {

            width: 100%;

            border-collapse: collapse;

            margin-top: 25px;
        }


        th,
        td {

            border: 1px solid #ddd;

            padding: 12px;

            text-align: center;
        }


        th {

            background: #2563eb;

            color: white;
        }


        tr:nth-child(even) {

            background: #f5f7ff;
        }


        .status {

            margin: 20px;

            font-weight: bold;

            font-size: 18px;
        }


        .success {

            color: green;
        }


        .error {

            color: red;
        }


        .empty {

            color: #555;
        }


        button {

            padding: 12px 25px;

            border: none;

            border-radius: 7px;

            background: #2563eb;

            color: white;

            font-size: 16px;

            cursor: pointer;

            margin-top: 20px;

            margin-right: 10px;
        }


        button:hover {

            background: #1d4ed8;
        }


        .refresh {

            background: #16a34a;
        }


        .refresh:hover {

            background: #15803d;
        }

    </style>

</head>


<body>


<div class="container">


    <h1>
        Attendance Report
    </h1>


    <div id="status"
         class="status">

        Loading attendance...

    </div>


    <table id="attendanceTable">


        <thead>

            <tr>

                <th>
                    Student Name
                </th>

                <th>
                    Date
                </th>

                <th>
                    Time
                </th>

                <th>
                    Status
                </th>

            </tr>

        </thead>


        <tbody id="attendanceBody">

        </tbody>


    </table>


    <button
        class="refresh"
        onclick="loadAttendance()">

        Refresh

    </button>


    <button
        onclick="goBack()">

        Back

    </button>


</div>



<script>


// ==========================================
// BACKEND URL
// ==========================================

const API_URL =
    "http://127.0.0.1:5050";


// ==========================================
// LOAD ATTENDANCE
// ==========================================

async function loadAttendance() {


    const status =
        document.getElementById("status");


    const tbody =
        document.getElementById("attendanceBody");


    try {


        status.innerText =
            "Loading attendance...";


        status.className =
            "status";


        tbody.innerHTML = "";


        // ----------------------------------
        // SEND REQUEST TO FLASK
        // ----------------------------------

        const response =
            await fetch(
                API_URL + "/attendance"
            );


        // ----------------------------------
        // CHECK HTTP RESPONSE
        // ----------------------------------

        if (!response.ok) {

            throw new Error(
                "Server returned HTTP " +
                response.status
            );

        }


        // ----------------------------------
        // CONVERT RESPONSE TO JSON
        // ----------------------------------

        const data =
            await response.json();


        console.log(
            "Attendance API response:",
            data
        );


        // ----------------------------------
        // CHECK API RESPONSE
        // ----------------------------------

        if (
            !data ||
            !Array.isArray(data.records)
        ) {

            throw new Error(
                "Invalid attendance data received from server."
            );

        }


        // ----------------------------------
        // NO RECORDS
        // ----------------------------------

        if (
            data.records.length === 0
        ) {

            status.innerText =
                "No attendance records found.";

            status.className =
                "status empty";

            return;

        }


        // ----------------------------------
        // DISPLAY RECORDS
        // ----------------------------------

        data.records.forEach(
            record => {


                const row =
                    document.createElement("tr");


                const studentName =
                    record["Student Name"] ||
                    record["student_name"] ||
                    record["name"] ||
                    "";


                const date =
                    record["Date"] ||
                    record["date"] ||
                    "";


                const time =
                    record["Time"] ||
                    record["time"] ||
                    "--";


                const attendanceStatus =
                    record["Status"] ||
                    record["status"] ||
                    "Present";


                row.innerHTML = `

                    <td>
                        ${studentName}
                    </td>

                    <td>
                        ${date}
                    </td>

                    <td>
                        ${time}
                    </td>

                    <td>
                        ${attendanceStatus}
                    </td>

                `;


                tbody.appendChild(row);

            }
        );


        // ----------------------------------
        // SUCCESS MESSAGE
        // ----------------------------------

        status.innerText =
            "Attendance loaded successfully.";

        status.className =
            "status success";


    }


    catch (error) {


        console.error(
            "Attendance loading error:",
            error
        );


        status.innerText =
            "Failed to load attendance: " +
            error.message;


        status.className =
            "status error";


    }

}


// ==========================================
// BACK BUTTON
// ==========================================

function goBack() {

    window.location.href =
        "attendance.html";

}


// ==========================================
// LOAD REPORT WHEN PAGE OPENS
// ==========================================

window.addEventListener(
    "DOMContentLoaded",
    loadAttendance
);


</script>


</body>

</html>
